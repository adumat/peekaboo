---
# Example: deploy Peekaboo on Kubernetes with Flux + the bjw-s app-template chart.
#
# Prerequisites:
#   1. An app-template OCIRepository source, e.g.
#        apiVersion: source.toolkit.fluxcd.io/v1
#        kind: OCIRepository
#        metadata: { name: app-template }
#        spec:
#          interval: 1h
#          url: oci://ghcr.io/bjw-s-labs/helm/app-template
#          ref: { tag: 5.0.1 }
#   2. A ConfigMap named `peekaboo-config` holding config.yaml (see config.example.yaml).
#
# Adjust the image tag, hostname, gateway parentRefs and cameras to your setup.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peekaboo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      peekaboo:
        containers:
          app:
            image:
              repository: ghcr.io/adumat/peekaboo
              tag: latest
            env:
              PEEKABOO_CONFIG: /config/config.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: &port 3000 }
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http: { port: *port }
    route:
      app:
        hostnames: ["peekaboo.example.lan"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{ identifier: app, port: *port }]
    persistence:
      config:
        type: configMap
        name: peekaboo-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
