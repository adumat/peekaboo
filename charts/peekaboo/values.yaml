replicaCount: 1

image:
  repository: ghcr.io/adumat/peekaboo
  # defaults to the chart appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

# Peekaboo configuration — rendered verbatim into /config/config.yaml.
config:
  go2rtc:
    url: "http://go2rtc.example.lan:1984"
    rtsp: "go2rtc:8554"
  idleTimeout: 15
  cameras:
    - name: living-room
      label: "Living room"
    - name: bedroom
      label: "Bedroom"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: peekaboo.example.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
