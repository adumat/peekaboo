services:
  peekaboo:
    image: ghcr.io/adumat/peekaboo:latest
    # To build locally instead of pulling, comment out `image:` above and use:
    # build: .
    ports:
      - "3000:3000"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    # Or configure without a file:
    # environment:
    #   GO2RTC_URL: "http://go2rtc:1984"
    #   GO2RTC_RTSP: "go2rtc:8554"
    #   PEEKABOO_IDLE_TIMEOUT: "15"
    restart: unless-stopped
